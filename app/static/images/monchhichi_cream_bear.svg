<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <!-- 실제 크림 보아퍼 텍스처 필터 -->
    <filter id="creamFurTexture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045 0.045" numOctaves="4" result="noise" />
      <feColorMatrix type="matrix" values="
        0 0 0 0 0.88
        0 0 0 0 0.85
        0 0 0 0 0.78
        0.3 0.3 0.3 0 0" in="noise" result="coloredNoise" />
      <feComposite operator="in" in2="SourceGraphic" result="furPattern" />
      <feBlend mode="multiply" in="SourceGraphic" in2="furPattern" />
    </filter>

    <filter id="fabricTexture4" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.08 0.08" numOctaves="2" result="noise" />
      <feColorMatrix type="matrix" values="
        0 0 0 0 0.98
        0 0 0 0 0.88
        0 0 0 0 0.82
        0.15 0.15 0.15 0 0" in="noise" result="coloredNoise" />
      <feComposite operator="in" in2="SourceGraphic" result="fabricPattern" />
      <feBlend mode="multiply" in="SourceGraphic" in2="fabricPattern" />
    </filter>

    <!-- 소프트 웜크림 스튜디오 배경 -->
    <linearGradient id="studioCreamBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCFCFA" />
      <stop offset="50%" stop-color="#F7F6F0" />
      <stop offset="100%" stop-color="#EBE9DF" />
    </linearGradient>

    <!-- 바닥 접지 그림자 -->
    <radialGradient id="creamShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(120, 110, 95, 0.32)" />
      <stop offset="60%" stop-color="rgba(120, 110, 95, 0.1)" />
      <stop offset="100%" stop-color="rgba(120, 110, 95, 0)" />
    </radialGradient>

    <!-- 아이보리 크림 뽀송 보아퍼 그라데이션 -->
    <radialGradient id="creamFurGrad" cx="45%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#FAF7EE" />
      <stop offset="85%" stop-color="#EFEADC" />
      <stop offset="100%" stop-color="#DFD9C7" />
    </radialGradient>

    <!-- 살구빛 얼굴 -->
    <linearGradient id="creamFaceSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8F2" />
      <stop offset="100%" stop-color="#FEDECB" />
    </linearGradient>

    <!-- 입체 섀도우 -->
    <filter id="pouchShadowFilter3" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#4A453B" flood-opacity="0.22" />
    </filter>

    <filter id="blushBlur4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4.5" />
    </filter>
  </defs>

  <!-- 1. 배경 -->
  <rect width="800" height="1000" fill="url(#studioCreamBg)" />
  <ellipse cx="400" cy="850" rx="270" ry="42" fill="url(#creamShadow)" />

  <!-- 2. 아이보리 크림 곰돌이 몬치치 파우치 본체 (실물 100% 매칭) -->
  <g id="cream-bear-pouch" filter="url(#pouchShadowFilter3)">

    <!-- 우측 연핑크 미니 패브릭 라벨 태그 (실물 사진과 동일한 컬러) -->
    <g transform="translate(640, 520) rotate(15)">
      <rect x="0" y="0" width="38" height="55" rx="4" fill="#F48FB1" stroke="#EC407A" stroke-width="1" />
      <text x="19" y="34" font-family="'Brush Script MT', cursive" font-size="13" fill="#FFFFFF" text-anchor="middle" transform="rotate(-90 19 34)">Monchhichi</text>
    </g>

    <!-- ==========================================================
         [동글동글 곰돌이 귀 좌/우] (실물 사진: 안쪽 핑크 살구빛)
    =========================================================== -->
    <!-- 왼쪽 귀 -->
    <g id="bear-ear-left">
      <ellipse cx="205" cy="410" rx="60" ry="54" fill="url(#creamFurGrad)" stroke="#D8D2BE" stroke-width="1.5" />
      <!-- 귀 안쪽 핑크 귓바퀴 라인 -->
      <path d="M 230 435 C 200 430, 185 390, 205 385 C 220 380, 240 405, 230 435 Z" fill="#F8B4C7" opacity="0.85" />
    </g>

    <!-- 오른쪽 귀 -->
    <g id="bear-ear-right">
      <ellipse cx="595" cy="410" rx="60" ry="54" fill="url(#creamFurGrad)" stroke="#D8D2BE" stroke-width="1.5" />
      <!-- 귀 안쪽 핑크 귓바퀴 라인 -->
      <path d="M 570 435 C 600 430, 615 390, 595 385 C 580 380, 560 405, 570 435 Z" fill="#F8B4C7" opacity="0.85" />
    </g>

    <!-- 파우치 동글동글 빵빵한 메인 바디 (크림 화이트 보아퍼) -->
    <circle cx="400" cy="500" r="240" fill="url(#creamFurGrad)" filter="url(#creamFurTexture)" stroke="#D8D2BE" stroke-width="2" />

    <!-- 보아퍼 털 둘레 몽글몽글 구름 입체 돌기들 -->
    <g fill="url(#creamFurGrad)">
      <circle cx="190" cy="400" r="45" />
      <circle cx="170" cy="490" r="46" />
      <circle cx="185" cy="580" r="45" />
      <circle cx="230" cy="660" r="46" />
      <circle cx="300" cy="715" r="48" />
      <circle cx="400" cy="735" r="50" />
      <circle cx="500" cy="715" r="48" />
      <circle cx="570" cy="660" r="46" />
      <circle cx="615" cy="580" r="45" />
      <circle cx="630" cy="490" r="46" />
      <circle cx="610" cy="400" r="45" />
      <circle cx="560" cy="320" r="46" />
      <circle cx="480" cy="270" r="48" />
      <circle cx="400" cy="260" r="50" />
      <circle cx="320" cy="270" r="48" />
      <circle cx="240" cy="320" r="46" />
    </g>

    <!-- ==========================================================
         [얼굴 프레임: 실물과 동일한 물결형 봉제 자수 띠]
    =========================================================== -->
    <!-- 크림 털과 얼굴 경계 마감 스티치 띠 -->
    <path d="M 260 620 
             C 240 570, 245 510, 280 475 
             C 320 440, 360 460, 400 450 
             C 440 460, 480 440, 520 475 
             C 555 510, 560 570, 540 620 
             C 510 675, 470 690, 400 695 
             C 330 690, 290 675, 260 620 Z" 
          fill="#DFD7C4" stroke="#C9BEA8" stroke-width="2.5" />

    <!-- 뽀송한 살구빛 얼굴 -->
    <path d="M 268 615 
             C 250 570, 255 515, 288 485 
             C 322 452, 360 470, 400 460 
             C 440 470, 478 452, 512 485 
             C 545 515, 550 570, 532 615 
             C 505 665, 468 680, 400 685 
             C 332 680, 295 665, 268 615 Z" 
          fill="url(#creamFaceSkin)" filter="url(#fabricTexture4)" />

    <!-- 섬세한 스티치 점선 -->
    <path d="M 272 612 C 255 570, 260 520, 290 490 C 325 458, 360 475, 400 465 C 440 475, 475 458, 510 490 C 540 520, 545 570, 528 612 C 502 660, 465 676, 400 680 C 335 676, 298 660, 272 612 Z" 
          fill="none" stroke="#D7C9BA" stroke-width="1.8" stroke-dasharray="4,3" />

    <!-- ==========================================================
         [이목구비: 실물과 동일한 밀크 브라운 톤]
    =========================================================== -->
    <!-- 왼쪽 눈 -->
    <g id="left-eye-cream">
      <ellipse cx="340" cy="540" rx="19" ry="24" fill="#4A2612" stroke="#331A0C" stroke-width="1.5" />
      <circle cx="334" cy="532" r="7.5" fill="#FFFFFF" />
      <circle cx="347" cy="550" r="4" fill="#FFFFFF" />
      <path d="M 322 528 Q 340 512 358 524" stroke="#331A0C" stroke-width="3" stroke-linecap="round" fill="none" />
      <line x1="322" y1="528" x2="315" y2="524" stroke="#331A0C" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- 오른쪽 눈 -->
    <g id="right-eye-cream">
      <ellipse cx="460" cy="540" rx="19" ry="24" fill="#4A2612" stroke="#331A0C" stroke-width="1.5" />
      <circle cx="454" cy="532" r="7.5" fill="#FFFFFF" />
      <circle cx="467" cy="550" r="4" fill="#FFFFFF" />
      <path d="M 442 524 Q 460 512 478 528" stroke="#331A0C" stroke-width="3" stroke-linecap="round" fill="none" />
      <line x1="478" y1="528" x2="485" y2="524" stroke="#331A0C" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- [코] 브라운 동글코 -->
    <ellipse cx="400" cy="565" rx="18" ry="15" fill="#4A2612" stroke="#331A0C" stroke-width="1.5" />
    <ellipse cx="395" cy="560" rx="6" ry="4" fill="#FFFFFF" opacity="0.6" />

    <!-- [몬치치 시그니처 3개 주근깨 점] -->
    <circle cx="310" cy="580" r="2.8" fill="#5A321E" />
    <circle cx="325" cy="588" r="2.8" fill="#5A321E" />
    <circle cx="316" cy="598" r="2.8" fill="#5A321E" />

    <circle cx="490" cy="580" r="2.8" fill="#5A321E" />
    <circle cx="475" cy="588" r="2.8" fill="#5A321E" />
    <circle cx="484" cy="598" r="2.8" fill="#5A321E" />

    <!-- [방긋 웃는 입] 붉은 혀 내민 미소 -->
    <path d="M 368 586 
             C 382 618, 418 618, 432 586 
             C 415 592, 385 592, 368 586 Z" 
          fill="#A8182E" stroke="#331A0C" stroke-width="2.5" />
    <path d="M 380 596 C 392 615, 408 615, 420 596 Z" fill="#FF6B8B" />
    <path d="M 364 582 Q 368 588 372 586" stroke="#331A0C" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 436 582 Q 432 588 428 586" stroke="#331A0C" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- 핑크빛 볼터치 -->
    <ellipse cx="318" cy="565" rx="32" ry="20" fill="#FF8BA7" opacity="0.5" filter="url(#blushBlur4)" />
    <ellipse cx="482" cy="565" rx="32" ry="20" fill="#FF8BA7" opacity="0.5" filter="url(#blushBlur4)" />

  </g>

  <!-- 3. 쇼핑몰 룩북 뱃지 & 오버레이 타이포그래피 -->
  <!-- 좌상단 공식 인증 뱃지 -->
  <g transform="translate(60, 60)">
    <rect width="180" height="38" rx="19" fill="#FFFFFF" opacity="0.95" />
    <text x="90" y="24" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800" fill="#786A55" text-anchor="middle" letter-spacing="1">CREAM MONCHHICHI</text>
  </g>

  <!-- 우상단 위시리스트 아이콘 -->
  <g transform="translate(690, 60)">
    <circle cx="25" cy="25" r="25" fill="#FFFFFF" opacity="0.95" />
    <path d="M 25 33 C 16 24, 8 13, 17 6 C 22 2, 25 6, 25 7 C 25 6, 28 2, 33 6 C 42 13, 34 24, 25 33 Z" fill="#F48FB1" />
  </g>

  <!-- 하단 상품명 안내 텍스트 -->
  <text x="400" y="930" font-family="'Pretendard', 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#1E293B" text-anchor="middle" letter-spacing="2">IVORY CREAM BEAR MONCHHICHI POUCH</text>
  <text x="400" y="960" font-family="'Pretendard', sans-serif" font-size="14" font-weight="500" fill="#64748B" text-anchor="middle" letter-spacing="1">포근하고 부드러운 아이보리 크림 곰돌이 보아퍼 파우치</text>
</svg>
