<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <!-- 배경 그라데이션 (하늘색 파스텔 스튜디오) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF4FB" />
      <stop offset="50%" stop-color="#D8EAF7" />
      <stop offset="100%" stop-color="#C5E0F4" />
    </linearGradient>

    <!-- 스튜디오 바닥 그림자 -->
    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(110, 140, 165, 0.45)" />
      <stop offset="60%" stop-color="rgba(110, 140, 165, 0.15)" />
      <stop offset="100%" stop-color="rgba(110, 140, 165, 0)" />
    </radialGradient>

    <!-- 인형 털 그라데이션 (부드러운 밤색) -->
    <linearGradient id="furGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7B4E32" />
      <stop offset="100%" stop-color="#54311D" />
    </linearGradient>

    <!-- 턱받이/케이프 하늘색 그라데이션 -->
    <linearGradient id="skyblueCloth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9FD5F6" />
      <stop offset="50%" stop-color="#6DBDE9" />
      <stop offset="100%" stop-color="#4AA8DC" />
    </linearGradient>

    <!-- 얼굴 스킨톤 그라데이션 -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE0CC" />
      <stop offset="100%" stop-color="#F7C9AA" />
    </linearGradient>

    <!-- 볼터치 블러 필터 -->
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" />
    </filter>

    <!-- 소프트 드롭 섀도우 -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#4b6b88" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- 1. 배경 -->
  <rect width="800" height="1000" fill="url(#bgGrad)" />

  <!-- 상단 감성 조명 데코 -->
  <circle cx="150" cy="180" r="160" fill="#FFFFFF" opacity="0.35" filter="url(#blurFilter)" />
  <circle cx="680" cy="240" r="120" fill="#BEE2FA" opacity="0.4" filter="url(#blurFilter)" />

  <!-- 2. 바닥 그림자 -->
  <ellipse cx="400" cy="850" rx="220" ry="40" fill="url(#floorShadow)" />

  <!-- 3. 메인 몬치치 인형 오브젝트 그룹 -->
  <g id="monchhichi-doll" filter="url(#softShadow)">

    <!-- 귀 (좌/우 털 & 안쪽 살구색) -->
    <circle cx="270" cy="330" r="55" fill="url(#furGrad)" />
    <circle cx="270" cy="330" r="32" fill="#F7C9AA" />
    <circle cx="530" cy="330" r="55" fill="url(#furGrad)" />
    <circle cx="530" cy="330" r="32" fill="#F7C9AA" />

    <!-- 털 머리 베이스 -->
    <ellipse cx="400" cy="340" rx="165" ry="145" fill="url(#furGrad)" />

    <!-- 머리 윗부분 쫑긋한 털 장식 -->
    <path d="M 380 200 C 390 160, 410 160, 420 200 Z" fill="url(#furGrad)" />
    <path d="M 365 208 C 370 175, 385 175, 390 210 Z" fill="url(#furGrad)" />
    <path d="M 410 208 C 415 175, 430 175, 435 210 Z" fill="url(#furGrad)" />

    <!-- 하늘색 리본 보닛 머리 장식 -->
    <path d="M 285 240 Q 400 190 515 240 Q 525 265 510 270 Q 400 225 290 270 Z" fill="url(#skyblueCloth)" />
    <!-- 미니 하늘색 리본 -->
    <circle cx="340" cy="225" r="10" fill="#FFFFFF" />
    <ellipse cx="325" cy="225" rx="15" ry="9" fill="url(#skyblueCloth)" transform="rotate(-15 325 225)" />
    <ellipse cx="355" cy="225" rx="15" ry="9" fill="url(#skyblueCloth)" transform="rotate(15 355 225)" />

    <!-- 몸통 (폭신한 브라운 털) -->
    <ellipse cx="400" cy="620" rx="140" ry="170" fill="url(#furGrad)" />

    <!-- 다리 & 발 (살구색 발바닥) -->
    <ellipse cx="320" cy="790" rx="42" ry="60" fill="url(#furGrad)" />
    <ellipse cx="480" cy="790" rx="42" ry="60" fill="url(#furGrad)" />
    <ellipse cx="320" cy="825" rx="30" ry="20" fill="#F7C9AA" />
    <ellipse cx="480" cy="825" rx="30" ry="20" fill="#F7C9AA" />

    <!-- 얼굴 (둥글고 귀여운 살구빛 페이스) -->
    <ellipse cx="400" cy="365" rx="115" ry="100" fill="url(#skinGrad)" />

    <!-- 이마 헤어라인 털 디테일 (뽀글뽀글 뱅 스타일) -->
    <path d="M 305 315 C 320 290, 340 310, 355 295 C 370 280, 390 300, 400 290 C 410 300, 430 280, 445 295 C 460 310, 480 290, 495 315 C 470 295, 430 285, 400 285 C 370 285, 330 295, 305 315 Z" fill="url(#furGrad)" />

    <!-- 큰 눈 (초롱초롱한 만화 눈빛) -->
    <!-- 왼쪽 눈 -->
    <ellipse cx="345" cy="355" rx="18" ry="22" fill="#2C1B10" />
    <circle cx="340" cy="347" r="7" fill="#FFFFFF" />
    <circle cx="352" cy="363" r="3.5" fill="#FFFFFF" />
    <path d="M 326 332 Q 345 324 362 332" stroke="#4A2612" stroke-width="3" fill="none" stroke-linecap="round" />

    <!-- 오른쪽 눈 -->
    <ellipse cx="455" cy="355" rx="18" ry="22" fill="#2C1B10" />
    <circle cx="450" cy="347" r="7" fill="#FFFFFF" />
    <circle cx="462" cy="363" r="3.5" fill="#FFFFFF" />
    <path d="M 438 332 Q 455 324 474 332" stroke="#4A2612" stroke-width="3" fill="none" stroke-linecap="round" />

    <!-- 주근깨 (몬치치 시그니처 3개씩) -->
    <circle cx="330" cy="385" r="2.5" fill="#C47D52" />
    <circle cx="342" cy="390" r="2.5" fill="#C47D52" />
    <circle cx="335" cy="397" r="2.5" fill="#C47D52" />

    <circle cx="470" cy="385" r="2.5" fill="#C47D52" />
    <circle cx="458" cy="390" r="2.5" fill="#C47D52" />
    <circle cx="465" cy="397" r="2.5" fill="#C47D52" />

    <!-- 핑크빛 볼터치 -->
    <ellipse cx="325" cy="385" rx="25" ry="16" fill="#FF7878" opacity="0.45" filter="url(#blurFilter)" />
    <ellipse cx="475" cy="385" rx="25" ry="16" fill="#FF7878" opacity="0.45" filter="url(#blurFilter)" />

    <!-- 귀여운 코 -->
    <ellipse cx="400" cy="378" rx="9" ry="6" fill="#3D1D10" />

    <!-- 앙증맞은 입 (살짝 벌린 미소) -->
    <path d="M 390 405 Q 400 420 410 405" stroke="#9A3C2A" stroke-width="3.5" fill="#C94A38" stroke-linecap="round" />

    <!-- 4. 하늘색 시그니처 턱받이(Bib) 레이어 -->
    <g id="sky-blue-bib">
      <!-- 턱받이 본체 레이스 테두리 (화이트) -->
      <path d="M 285 450 Q 400 420 515 450 C 535 560, 480 625, 400 625 C 320 625, 265 560, 285 450 Z" 
            fill="#FFFFFF" />
      
      <!-- 턱받이 하늘색 원단 -->
      <path d="M 295 455 Q 400 430 505 455 C 520 545, 475 610, 400 610 C 325 610, 280 545, 295 455 Z" 
            fill="url(#skyblueCloth)" />

      <!-- 턱받이 레이스 주름 디테일 도트 -->
      <circle cx="310" cy="490" r="4" fill="#FFFFFF" opacity="0.8" />
      <circle cx="330" cy="530" r="4" fill="#FFFFFF" opacity="0.8" />
      <circle cx="360" cy="570" r="4" fill="#FFFFFF" opacity="0.8" />
      <circle cx="400" cy="590" r="4" fill="#FFFFFF" opacity="0.8" />
      <circle cx="440" cy="570" r="4" fill="#FFFFFF" opacity="0.8" />
      <circle cx="470" cy="530" r="4" fill="#FFFFFF" opacity="0.8" />
      <circle cx="490" cy="490" r="4" fill="#FFFFFF" opacity="0.8" />

      <!-- 턱받이 중앙 감성 로고 텍스트/마크 -->
      <circle cx="400" cy="515" r="26" fill="#FFFFFF" opacity="0.9" />
      <!-- 미니 하트 -->
      <path d="M 400 524 C 392 516, 384 504, 393 496 C 398 492, 400 495, 400 496 C 400 495, 402 492, 407 496 C 416 504, 408 516, 400 524 Z" fill="#6DBDE9" />
      <text x="400" y="546" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="bold" font-size="11" fill="#4AA8DC" text-anchor="middle" letter-spacing="1">MONCHHICHI</text>
    </g>

    <!-- 팔 (왼쪽: 몸 옆에 귀엽게, 오른쪽: 몬치치 시그니처 엄지손가락 쪽쪽 빨기 포즈) -->
    <!-- 왼팔 -->
    <g id="left-arm">
      <path d="M 290 500 C 250 550, 260 620, 290 640 C 305 645, 320 620, 310 590 Z" fill="url(#furGrad)" />
      <!-- 왼손 살구색 -->
      <circle cx="288" cy="635" r="18" fill="#F7C9AA" />
    </g>

    <!-- 오른팔 & 쪽쪽이/엄지손가락 입에 물기 -->
    <g id="right-arm">
      <path d="M 510 500 C 550 530, 520 590, 460 520 Z" fill="url(#furGrad)" />
      <!-- 살구색 앙증맞은 오른손 (입 근처) -->
      <ellipse cx="430" cy="435" rx="20" ry="18" fill="#F7C9AA" />
      <!-- 노란색/하늘색 쪽쪽이(젖꼭지) 노리개 -->
      <circle cx="418" cy="422" r="10" fill="#FFF275" stroke="#E5C744" stroke-width="2" />
      <path d="M 423 425 Q 430 435 423 442" stroke="#6DBDE9" stroke-width="4" fill="none" stroke-linecap="round" />
    </g>

  </g>

  <!-- 5. 쇼핑몰 룩북 스타일 뱃지 & 오버레이 타이포그래피 -->
  <!-- 좌상단 NEW ARRIVAL 뱃지 -->
  <g transform="translate(60, 60)">
    <rect width="130" height="34" rx="17" fill="#FFFFFF" opacity="0.9" />
    <text x="65" y="22" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" fill="#4AA8DC" text-anchor="middle" letter-spacing="2">NEW VIBE</text>
  </g>

  <!-- 우상단 위시리스트 하트 아이콘 -->
  <g transform="translate(690, 60)">
    <circle cx="25" cy="25" r="25" fill="#FFFFFF" opacity="0.9" />
    <path d="M 25 33 C 16 24, 8 13, 17 6 C 22 2, 25 6, 25 7 C 25 6, 28 2, 33 6 C 42 13, 34 24, 25 33 Z" fill="#6DBDE9" />
  </g>

  <!-- 하단 쇼핑몰 무드 텍스트 -->
  <text x="400" y="930" font-family="'Pretendard', 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#355670" text-anchor="middle" letter-spacing="3">SKY BLUE MONCHHICHI EDITION</text>
  <text x="400" y="960" font-family="'Pretendard', sans-serif" font-size="14" font-weight="400" fill="#6B8A9E" text-anchor="middle" letter-spacing="1">파스텔 스카이블루 턱받이 &amp; 보닛 컬렉션</text>
</svg>
