<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- 딸기 과육 그라데이션 (선명한 레드 & 핑크빛 반사광) -->
    <radialGradient id="berryBody" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FF4D6D" />
      <stop offset="40%" stop-color="#E60039" />
      <stop offset="85%" stop-color="#C9002B" />
      <stop offset="100%" stop-color="#9E0022" />
    </radialGradient>

    <!-- 꼭지 잎사귀 그라데이션 (싱그러운 그린) -->
    <linearGradient id="berryLeaf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#84CC16" />
      <stop offset="50%" stop-color="#4D7C0F" />
      <stop offset="100%" stop-color="#365314" />
    </linearGradient>

    <!-- 반짝이 하이라이트 -->
    <radialGradient id="berryGlow" cx="30%" cy="25%" r="35%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- 그림자 -->
    <filter id="berryShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#88001B" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- 메인 딸기 형태 -->
  <g filter="url(#berryShadow)">
    <!-- 딸기 본체 (통통하고 탐스러운 하트/원추 형태) -->
    <path d="M 50 92 
             C 25 80, 10 58, 14 36 
             C 17 20, 32 16, 44 22 
             C 47 24, 53 24, 56 22 
             C 68 16, 83 20, 86 36 
             C 90 58, 75 80, 50 92 Z" 
          fill="url(#berryBody)" />

    <!-- 입체 하이라이트 광택 -->
    <ellipse cx="32" cy="36" rx="14" ry="18" fill="url(#berryGlow)" transform="rotate(-20 32 36)" />

    <!-- 딸기 씨앗 (골드 옐로우) -->
    <g fill="#FDE047" opacity="0.9">
      <ellipse cx="28" cy="42" rx="1.8" ry="2.6" transform="rotate(-15 28 42)" />
      <ellipse cx="40" cy="38" rx="1.8" ry="2.6" transform="rotate(-5 40 38)" />
      <ellipse cx="54" cy="38" rx="1.8" ry="2.6" transform="rotate(5 54 38)" />
      <ellipse cx="68" cy="42" rx="1.8" ry="2.6" transform="rotate(15 68 42)" />

      <ellipse cx="24" cy="56" rx="1.8" ry="2.6" transform="rotate(-20 24 56)" />
      <ellipse cx="36" cy="52" rx="1.8" ry="2.6" transform="rotate(-10 36 52)" />
      <ellipse cx="50" cy="50" rx="1.8" ry="2.6" />
      <ellipse cx="64" cy="52" rx="1.8" ry="2.6" transform="rotate(10 64 52)" />
      <ellipse cx="74" cy="56" rx="1.8" ry="2.6" transform="rotate(20 74 56)" />

      <ellipse cx="32" cy="68" rx="1.8" ry="2.6" transform="rotate(-15 32 68)" />
      <ellipse cx="44" cy="64" rx="1.8" ry="2.6" transform="rotate(-5 44 64)" />
      <ellipse cx="56" cy="64" rx="1.8" ry="2.6" transform="rotate(5 56 64)" />
      <ellipse cx="66" cy="68" rx="1.8" ry="2.6" transform="rotate(15 66 68)" />

      <ellipse cx="40" cy="78" rx="1.6" ry="2.3" transform="rotate(-10 40 78)" />
      <ellipse cx="50" cy="76" rx="1.6" ry="2.3" />
      <ellipse cx="58" cy="78" rx="1.6" ry="2.3" transform="rotate(10 58 78)" />

      <ellipse cx="48" cy="86" rx="1.4" ry="2" />
    </g>

    <!-- 줄기 (Stem) -->
    <path d="M 49 22 C 48 14, 50 8, 55 5 C 57 8, 55 14, 52 22 Z" fill="#65A30D" />

    <!-- 꼭지 잎사귀 5장 (Calyx) -->
    <!-- 좌2 -->
    <path d="M 48 24 C 38 18, 22 14, 18 20 C 24 24, 38 24, 48 24 Z" fill="url(#berryLeaf)" />
    <!-- 좌1 -->
    <path d="M 48 24 C 38 24, 28 28, 26 36 C 34 34, 44 30, 48 24 Z" fill="url(#berryLeaf)" />
    <!-- 중앙 -->
    <path d="M 48 24 C 44 32, 46 40, 50 42 C 54 40, 56 32, 52 24 Z" fill="url(#berryLeaf)" />
    <!-- 우1 -->
    <path d="M 52 24 C 56 30, 66 34, 74 36 C 72 28, 62 24, 52 24 Z" fill="url(#berryLeaf)" />
    <!-- 우2 -->
    <path d="M 52 24 C 62 24, 76 24, 82 20 C 78 14, 62 18, 52 24 Z" fill="url(#berryLeaf)" />
  </g>
</svg>
